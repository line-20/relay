name: python-tests

# Run the maintainer-tooling test suites (telemetry segmentation + worker-harvest
# recovery + MEMORY.md compaction). These build their own temp git/memory fixtures,
# so they need only python3, node, and git. (Name kept as `python-tests` so the
# required-check reference stays stable, though it now also runs the node suite.)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Configure git identity (worktree fixtures need one)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - name: reflect-commands segmentation tests
        run: python3 scripts/tests/test_reflect_commands.py
      - name: relay_harvest recovery tests
        run: python3 scripts/tests/test_relay_harvest.py
      - name: memory-check compaction tests
        run: node scripts/tests/test_memory_check.mjs
