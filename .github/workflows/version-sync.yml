name: version-sync

# Fail the build if any hardcoded version has drifted from plugin.json, the current
# version isn't documented in the CHANGELOG, or a short-name twin has fallen out of
# step with the command it mirrors.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version sync
        run: bash scripts/check-version.sh
      - name: Check short-name twins
        run: bash scripts/gen-short-names.sh --check
